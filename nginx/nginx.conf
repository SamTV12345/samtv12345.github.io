server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Komprimierung (nginx:stable-alpine hat gzip standardmäßig aus)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml text/plain;

    # Schriften ändern sich nicht: lange cachen
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
