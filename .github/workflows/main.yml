name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall trunk

      - name: Check
        run: cargo check --target wasm32-unknown-unknown

      - name: Build site
        run: trunk build --cargo-profile release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Build Docker image
        run: docker build -t homepage:${{ github.run_id }} .

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          docker tag homepage:${{ github.run_id }} ghcr.io/samtv12345/samtv.github.io:${{ github.run_id }}
          docker push ghcr.io/samtv12345/samtv.github.io:${{ github.run_id }}

      - name: Update dynamic image tag
        run: |
          sed -i "s|tag: .*|tag: \"${{ github.run_id }}\"|g" ./helm/values-dynamic.yaml
          if git diff --quiet -- ./helm/values-dynamic.yaml; then
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./helm/values-dynamic.yaml
          git commit -m "chore: bump image to ${{ github.run_id }}"
          git push origin main
